<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000">
  <defs>
    <style>
      .line{fill:none;stroke:#295D44;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <g>
    <!-- Very simplified continental outlines (minimal line art) -->
    <!-- North America -->
    <path class="line" d="M190 290 l120 -60 160 40 90 -40 80 30 60 -10 50 50 -70 80 -170 30 -90 80 -120 -20 -90 -80 80 -100z"/>
    <!-- South America -->
    <path class="line" d="M650 500 l60 40 40 120 -50 110 60 120 -40 50 -120 -90 40 -90 -30 -110 40 -110z"/>
    <!-- Europe -->
    <path class="line" d="M1080 250 l100 -30 120 20 80 -10 60 50 -40 50 -110 10 -90 -20 -70 -40 -50 -30z"/>
    <!-- Africa -->
    <path class="line" d="M1130 320 l60 60 -20 100 60 140 -30 130 -110 30 -120 -110 40 -120 -10 -120 50 -80 80 -30z"/>
    <!-- Asia -->
    <path class="line" d="M1380 260 l120 -30 140 40 100 20 90 70 -40 70 -120 0 -80 -40 -100 20 -80 -50 -30 -100z"/>
    <!-- Australia -->
    <path class="line" d="M1660 720 l120 10 80 50 -40 60 -120 30 -120 -40 20 -70 60 -40z"/>
    <!-- Greenland -->
    <path class="line" d="M720 120 l120 -30 90 20 -10 80 -100 10 -100 -20z"/>
    <!-- Simple meridians/parallels for texture -->
    <path class="line" d="M100 500 H1900" opacity=".25"/>
    <path class="line" d="M100 350 H1900" opacity=".2"/>
    <path class="line" d="M100 650 H1900" opacity=".2"/>
    <path class="line" d="M600 80 V920" opacity=".15"/>
    <path class="line" d="M1000 80 V920" opacity=".15"/>
    <path class="line" d="M1400 80 V920" opacity=".15"/>
  </g>
</svg>


